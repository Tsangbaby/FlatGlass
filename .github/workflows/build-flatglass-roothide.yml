name: FlatGlass RootHide test package

on:
  push:
    branches: [build/flatglass-1.8.4-repaired-roothide]

permissions:
  contents: read

jobs:
  roothide:
    name: Build RootHide on macOS
    if: github.repository == 'Tsangbaby/FlatGlass'
    runs-on: macos-15
    timeout-minutes: 28
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      THEOS_REVISION: 958fea4f779943505b15b93c88bb4db8d97b346d
      PREFERENCES_SDK_REVISION: 0222fd5413cf4b9af096f37b4621afa2688572f7
      PREFERENCES_TBD_SHA256: 9daceaff6cf94346594a12f9ef9c2ea23de15475b516f9e33c20871a018c098b
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out this branch's pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the source and record the toolchain
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY:$GITHUB_EVENT_NAME:$GITHUB_REF" in
            Tsangbaby/FlatGlass:push:refs/heads/build/flatglass-1.8.4-repaired-roothide) ;;
            *) printf '%s\n' 'Unexpected repository, event, or ref' >&2; exit 1 ;;
          esac
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/flatglass-artifacts"
          mkdir -p "$evidence"
          printf '%s\n' "FLATGLASS_ARTIFACT_DIR=$evidence" "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          printf '%s\n' "$source_sha" > "$evidence/SOURCE_COMMIT.txt"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$evidence/SOURCE_REPOSITORY.txt"
          printf '%s\n' "$GITHUB_REF" > "$evidence/SOURCE_REF.txt"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$evidence/BUILD_RUN.txt"
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos --show-sdk-version
          } 2>&1 | tee "$evidence/toolchain.log"

      - name: Run source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v 2>&1 | tee "$FLATGLASS_ARTIFACT_DIR/source-tests.log"

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          {
            brew install make dpkg ldid xz
            brew list --versions make dpkg ldid xz
            printf '%s\n' "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
            command -v dpkg-deb ldid xz
          } 2>&1 | tee "$FLATGLASS_ARTIFACT_DIR/dependencies.log"

      - name: Install pinned RootHide Theos and Preferences link stub
        shell: bash
        run: |
          set -euo pipefail
          {
            git init "$THEOS"
            git -C "$THEOS" fetch --no-tags --depth=1 https://github.com/roothide/theos.git "$THEOS_REVISION"
            git -C "$THEOS" checkout --detach FETCH_HEAD
            test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_REVISION"
            git -C "$THEOS" submodule update --init --recursive --depth=1 --jobs 4
            modules=$(git -C "$THEOS" submodule status --recursive)
            printf '%s\n' "$modules"
            if printf '%s\n' "$modules" | grep -E '^[+U-]'; then exit 1; fi
            printf '%s\n' "$THEOS_REVISION" > "$FLATGLASS_ARTIFACT_DIR/THEOS_COMMIT.txt"
            stub="$THEOS/lib/iphone/roothide/Preferences.framework/Preferences.tbd"
            mkdir -p "$(dirname "$stub")"
            curl --fail --silent --show-error --location --retry 2 --max-time 90 \
              "https://raw.githubusercontent.com/theos/sdks/$PREFERENCES_SDK_REVISION/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd" \
              --output "$stub"
            printf '%s  %s\n' "$PREFERENCES_TBD_SHA256" "$stub" | shasum -a 256 -c -
          } 2>&1 | tee "$FLATGLASS_ARTIFACT_DIR/theos-setup.log"

      - name: Compile and package RootHide
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          make -j1 package messages=yes FINALPACKAGE=1 INSTALL=0 THEOS_PACKAGE_SCHEME=roothide \
            THEOS_PLATFORM_SDK_ROOT="$DEVELOPER_DIR" SYSROOT="$sdk" ISYSROOT="$sdk" \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz 2>&1 | tee "$FLATGLASS_ARTIFACT_DIR/theos-build.log"
          debs=(packages/*.deb)
          [[ ${#debs[@]} -eq 1 && -f "${debs[0]}" ]]
          cp "${debs[0]}" "$FLATGLASS_ARTIFACT_DIR/"
          (cd "$FLATGLASS_ARTIFACT_DIR" && shasum -a 256 -- *.deb > SHA256SUMS.txt)

      - name: Check package metadata and all four Mach-O targets
        shell: bash
        run: |
          set -euo pipefail
          {
            debs=("$FLATGLASS_ARTIFACT_DIR"/*.deb)
            [[ ${#debs[@]} -eq 1 && -f "${debs[0]}" ]]
            deb=${debs[0]}
            test "$(dpkg-deb -f "$deb" Package)" = "$(sed -n 's/^Package: //p' control)"
            test "$(dpkg-deb -f "$deb" Version)" = "$(sed -n 's/^Version: //p' control)"
            test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            payload=$(mktemp -d "$RUNNER_TEMP/flatglass-payload.XXXXXX")
            dpkg-deb -x "$deb" "$payload"
            test ! -e "$payload/var/jb"
            for binary in \
              Library/MobileSubstrate/DynamicLibraries/FlatGlassIconServices.dylib \
              Library/MobileSubstrate/DynamicLibraries/FlatGlassRefresh.dylib \
              Library/PreferenceBundles/FlatGlassPrefs.bundle/FlatGlassPrefs \
              usr/libexec/flatglass; do
              xcrun lipo "$payload/$binary" -verify_arch arm64 arm64e
              xcrun lipo -archs "$payload/$binary"
              xcrun otool -arch all -L "$payload/$binary"
            done
          } 2>&1 | tee "$FLATGLASS_ARTIFACT_DIR/package-check.log"

      - name: Upload package and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatglass-roothide-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flatglass-artifacts/
          if-no-files-found: error
          retention-days: 14
